version: "3.5"

services:
  py2cyto:
    build:
      context: .
    stdin_open: true
    tty: true
    volumes:
      - .:/tests
    restart: on-failure
    ports:
      - "1234"
    depends_on:
      - cytoscape
  cytoscape:
    image: ajshedivy/tps-cytoscape
    ports: 
      - "1234:1234"
      - "5900:5900"
    healthcheck:
        test: ["CMD", "curl", "-f", "http://cytoscape:1234"]
        interval: 30s
        timeout: 10s
        retries: 5
